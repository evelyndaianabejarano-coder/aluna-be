services:
  postgres:
    image: postgres:16-alpine
    container_name: aluna_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aluna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aluna_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aluna_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aluna_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aluna} -d ${POSTGRES_DB:-aluna_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aluna_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aluna_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  aluna_net:
    driver: bridge
